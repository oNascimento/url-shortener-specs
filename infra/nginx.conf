log_format safe escape=json '{"service":"shortener-web","status":$status,"duration":$request_time}';
server {
    listen 80;
    root /usr/share/nginx/html;
    access_log /dev/stdout safe;
    # Raw nginx errors can include request URLs and client IPs; status failures remain in the safe log.
    error_log /dev/null;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
