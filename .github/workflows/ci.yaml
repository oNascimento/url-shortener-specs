name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {global-json-file: global.json}
      - uses: actions/setup-node@v4
        with: {node-version: '22.19.0'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/build_contract.py && python scripts/validate_deliverables.py && git diff --exit-code -- .specs/contracts/openapi.json
      - run: dotnet restore --locked-mode && dotnet build --no-restore -c Release && dotnet test --no-build -c Release --logger trx
      - working-directory: web
        run: npm ci && npm run generate && git diff --exit-code -- src/api/schema.d.ts && npm test && npm run build
      - run: python scripts/bootstrap.py && docker compose config --quiet
      - run: docker compose build && docker compose up -d postgres registry rabbitmq mailpit collector loki prometheus grafana && docker compose run --rm jobs --migrate && docker compose up -d
      - run: |
          mkdir -p artifacts
          {
            echo "commit: $GITHUB_SHA"
            echo "dotnet: $(dotnet --version)"
            echo "node: $(node --version)"
            echo "python: $(python --version 2>&1)"
          } > artifacts/foundation-environment.txt
      - run: python scripts/smoke_foundation.py | tee artifacts/foundation-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-test-results
          path: |
            **/TestResults/**
            artifacts/**
      - run: docker compose down
        if: always()
