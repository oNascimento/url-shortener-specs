name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  documents:
    runs-on: ubuntu-latest
    outputs:
      functional: ${{ steps.scope.outputs.functional }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/validate_deliverables.py && python -m unittest discover -s tests/evidence-gates
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import os, subprocess
          base = os.environ.get('BASE', '')
          files = subprocess.check_output(['git', 'diff', '--name-only', base + '...HEAD'], text=True).splitlines() if base and set(base) != {'0'} else ['src/']
          functional = any(not f.endswith('.md') for f in files)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('functional=' + str(functional).lower() + '\n')
          PY
  redirection:
    needs: documents
    if: needs.documents.outputs.functional == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-dotnet@v4
        with: {global-json-file: global.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: dotnet restore --locked-mode && dotnet build --no-restore -c Debug
      - name: Task and cumulative coverage, real integrations and requirements
        env:
          EVIDENCE_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: python scripts/run_redirection.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redirection-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: |
            artifacts/redirection/**
            tests/redirection-*.json
            tests/redirection.runsettings
  link-management:
    needs: documents
    if: needs.documents.outputs.functional == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-dotnet@v4
        with: {global-json-file: global.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: dotnet restore --locked-mode && dotnet build --no-restore -c Debug
      - name: Feature requirements, concurrency, recovery and coverage
        run: dotnet test tests/Shortener.LinkManagement.Tests --no-build -c Debug --settings tests/link-management.runsettings --logger trx --results-directory artifacts/link-management/feature
      - name: Authentication regressions and complete shared-method coverage
        run: dotnet test tests/Shortener.Authentication.Tests --no-build -c Debug --settings tests/link-management.runsettings --logger trx --results-directory artifacts/link-management/auth
      - name: Evidence gates
        run: |
          python -m unittest discover -s tests/evidence-gates
          python scripts/check_link_coverage.py artifacts/link-management --output artifacts/link-management/coverage-summary.json
          python scripts/check_link_requirements.py artifacts/link-management/feature --output artifacts/link-management/requirements-summary.json
      - name: Record reproducible environment
        if: always()
        run: |
          mkdir -p artifacts/link-management
          {
            echo "commit: $GITHUB_SHA"
            echo "dotnet: $(dotnet --version)"
            echo "python: $(python --version 2>&1)"
            echo "docker: $(docker version --format '{{.Server.Version}}')"
            echo "PostgreSQL: 17.6; xUnit: 2.9.3; Coverlet: 6.0.4; build: Debug"
          } > artifacts/link-management/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-management-evidence
          path: |
            artifacts/link-management/**
            tests/link-management-coverage.json
            tests/link-management-requirements.json
            tests/link-management.runsettings
  foundation:
    needs: documents
    if: needs.documents.outputs.functional == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {global-json-file: global.json}
      - uses: actions/setup-node@v4
        with: {node-version: '22.19.0'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/build_contract.py && python scripts/validate_deliverables.py && git diff --exit-code -- .specs/contracts/openapi.json
      - run: dotnet restore --locked-mode && dotnet build --no-restore -c Release
      - name: Unit tests
        run: dotnet test --no-build -c Release --filter 'Category!=Integration' --logger trx
      - name: Integration tests (PostgreSQL and Mailpit)
        run: dotnet test --no-build -c Release --filter 'Category=Integration' --logger trx
      - working-directory: web
        run: npm ci && npm run generate && git diff --exit-code -- src/api/schema.d.ts && npm test && npm run build
      - id: local_environment
        run: python scripts/bootstrap.py && docker compose config --quiet
      - run: docker compose build && docker compose up -d postgres registry rabbitmq mailpit collector loki prometheus grafana && docker compose run --rm jobs --migrate && docker compose --profile proxy up -d
      - run: |
          mkdir -p artifacts
          {
            echo "commit: $GITHUB_SHA"
            echo "dotnet: $(dotnet --version)"
            echo "node: $(node --version)"
            echo "python: $(python --version 2>&1)"
          } > artifacts/foundation-environment.txt
      - shell: bash
        run: python scripts/smoke_foundation.py 2>&1 | tee artifacts/foundation-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-test-results
          path: |
            **/TestResults/**
            artifacts/**
      - run: docker compose --profile proxy down
        if: always() && steps.local_environment.outcome == 'success'
